<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e19e96e19e8ee19f8be19e91e19eb6e19f86e19e84e19e6e19e9fe19f8b</title>
<style>
  :root{--bg:#ffffff;--ink:#141414;--muted:#8a8f98;--line:#ececec;--watchbg:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{max-width:520px;margin:0 auto;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.04)}

  header{height:64px;background:#fff;border-bottom:3px solid #00A651;
    display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 16px;position:sticky;top:0;z-index:40}
  .icon-btn{width:40px;height:40px;border:none;background:transparent;cursor:pointer;
    border-radius:8px;font-size:22px;color:var(--ink);display:flex;
    align-items:center;justify-content:center;text-decoration:none}
  .icon-btn:hover{background:#f3f4f6}
  header .title{font-size:17px;font-weight:700;margin-inline-start:4px}

  .intro{text-align:center;padding:22px 20px 6px}
  .intro h1{font-size:24px;font-weight:800}
  .intro p{color:var(--muted);font-size:15px;margin-top:8px}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:18px 16px 110px}
  @media (min-width:440px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:14px 10px 12px;text-align:center;color:var(--ink);
    transition:.18s;display:flex;flex-direction:column;gap:8px}
  .card:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.08)}
  .card .pic{width:100%;aspect-ratio:1/1;border-radius:50%;background:var(--watchbg);
    display:flex;align-items:center;justify-content:center;padding:10px;
    border:2px solid var(--line)}
  .card .pic img{max-width:82%;max-height:82%;object-fit:contain}
  .card .name{font-size:14px;font-weight:600;margin-bottom:2px}
  .card.selected{border-color:#00A651;box-shadow:0 0 0 2px #00A651}
  .card.selected .pic{border-color:#00A651}

  .card-btns{display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .card-btn{
    width:100%;border:none;padding:9px 8px;border-radius:22px;
    font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:.15s;
    line-height:1.2;
  }
  .card-btn.pick{background:#00A651;color:#fff}
  .card-btn.pick:hover{background:#008C45}
  .card-btn.feat{background:#f3f4f6;color:#1a1a1a;border:1px solid #e5e7eb}
  .card-btn.feat:hover{background:#e5e7eb}

  .continue-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:-120px;
    width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);
    padding:14px 16px;transition:bottom .28s;z-index:50;
    box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .continue-bar.show{bottom:0}
  .continue-btn{display:block;width:100%;border:none;background:#00A651;color:#fff;
    padding:15px;border-radius:50px;font-size:16px;font-weight:700;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,166,81,.3)}
  .continue-btn:hover{background:#008C45}
</style>
</head>
<body>
  <header>
    <img src="images/wb-logo.svg" alt="Wing Bank" style="height:46px">
    <span class="title">e19e96e19e8ee19f8be19e91e19eb6e19f86e19e84e19e6e19e9fe19f8b</span>
    <a class="icon-btn" href="index.html" aria-label="ត្រលប់">&#8249;</a>
  </header>

  <div class="intro">
    <h1>ជ្រីសរីសពណ់ដែលកនហចុលចិត្ត</h1>
    <p>e19e98e19eb6e19e93 e19f92e19f91 e19e96e19e8ee19f8be19e95e19f92e19e8fe19eb6e19e85e19f8be19e98e19ebbe19e81 — e19e85e19ebbe19e85e19e8ae19eb8e19e98e19f92e19e94e19eb8e19e98e19eb8e19e9be</p>
  </div>

  <div class="grid" id="grid"></div>

  <div class="continue-bar" id="continueBar">
    <button class="continue-btn" id="continueBtn">បន្ត</button>
  </div>


<script>
  const watches = [
    {img:"images/1.jpg",  name:"e19e96e19e9ae19e8ee19f8be19e80e19e98e19eb6e19ebbe"},
    {img:"images/2.jpg",  name:"នីលមេហសាងិន"},
    {img:"images/3.jpg",  name:"នីលរាជទុរានី"},
    {img:"images/4.jpg",  name:"បហិវប្រាក់"},
    {img:"images/5.jpg",  name:"បេរនិង"},
    {img:"images/6.jpg",  name:"ក្រហាម"},
    {img:"images/7.jpg",  name:"ទុងមាស់"},
    {img:"images/8.jpg",  name:"សុកុលា"},
    {img:"images/9.jpg",  name:"បេជ"},
    {img:"images/10.jpg", name:"មាសលុង"},
    {img:"images/11.jpg", name:"បុរពុង"},
    {img:"images/12.jpg", name:"សា"},
    {img:"images/13.jpg", name:"លាវាន្ដា"},
    {img:"images/14.jpg", name:"មាស"},
    {img:"images/15.jpg", name:"ផុក្សា"},
    {img:"images/16.jpg", name:"ផ្កា"},
    {img:"images/17.jpg", name:"ផ្កាស្រាល់"},
    {img:"images/18.jpg", name:"លាវាន្ដាស្រាល់"},
    {img:"images/19.jpg", name:"នីលងាត់"},
    {img:"images/20.jpg", name:"ព្រាក់"},
    {img:"images/21.jpg", name:"លុង"},
  ];
  const grid = document.getElementById("grid");
  const bar  = document.getElementById("continueBar");
  const btn  = document.getElementById("continueBtn");
  let selected = null;

  grid.innerHTML = watches.map((w,i)=>
    `<div class="card" data-i="${i}">
       <div class="pic"><img src="${w.img}" alt="${w.name}"></div>
       <div class="name">${w.name}</div>
       <div class="card-btns">
         <button class="card-btn pick" data-act="pick" data-i="${i}">ជ្រីសរីសពណ់</button>
         <button class="card-btn feat" data-act="feat" data-i="${i}">លក្ខណអពាត</button>
       </div>
     </div>`).join("");

  grid.addEventListener("click", e=>{
    const b = e.target.closest(".card-btn");
    if(!b) return;
    const i = +b.dataset.i;
    if(b.dataset.act === "feat"){
      location.href = "watch-features.html?w=" + i;
      return;
    }
    if(b.dataset.act === "pick"){
      grid.querySelectorAll(".card").forEach(c=>c.classList.remove("selected"));
      b.closest(".card").classList.add("selected");
      selected = i;
      bar.classList.add("show");
    }
  });

  btn.addEventListener("click", ()=>{
    if(selected!==null) location.href = "order.html?w=" + selected;
  });
</script>
<script src="footer.js"></script>
<script src="tracker.js"></script>
</body>
</html>
